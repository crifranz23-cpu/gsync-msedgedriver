name: Update msedgedriver

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-driver:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get latest Edge stable version
        id: edge
        run: |
          VERSION=$(curl -s "https://edgeupdates.microsoft.com/api/products" \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          stable = next(p for p in data if p['Product'] == 'Stable')
          release = next(r for r in stable['Releases'] if r['Platform'] == 'Windows' and r['Architecture'] == 'x64')
          print(release['ProductVersion'])
          ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Latest Edge version: $VERSION"

      - name: Download matching msedgedriver
        run: |
          VERSION="${{ steps.edge.outputs.version }}"
          URL="https://msedgedriver.microsoft.com/$VERSION/edgedriver_win64.zip"
          echo "Downloading: $URL"
          curl -L -o edgedriver.zip "$URL"
          unzip -o edgedriver.zip msedgedriver.exe
          rm edgedriver.zip
          echo "Done."

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add msedgedriver.exe
          if git diff --staged --quiet; then
            echo "Already up to date — no commit needed"
          else
            git commit -m "chore: update msedgedriver to ${{ steps.edge.outputs.version }}"
            git push
          fi
